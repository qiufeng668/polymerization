name: Wula real Chrome network comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - name: Use runner stock Chrome without fingerprints patches
        run: python -u wula_chrome_probe.py
