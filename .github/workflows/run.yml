name: Wula outbound-path research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  egress:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/polymerization-1
          token: ${{ secrets.GIT_TOKEN }}
          path: vault_repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pyyaml curl_cffi
      - name: Download one proxy core
        run: |
          curl -fsSL --max-time 40 -o /tmp/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-compatible-v1.19.32.gz
          gunzip /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          sudo mv /tmp/mihomo /usr/local/bin/mihomo
      - name: Neutral HTTPS versus Wula on identical outbound
        run: python -u wula_egress_probe.py
  warp:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/polymerization-1
          token: ${{ secrets.GIT_TOKEN }}
          path: vault_repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests[socks]' pyyaml
      - name: Install user-mode WARP tools
        run: |
          curl -fsSL --max-time 40 -o /tmp/wgcf https://github.com/ViRb3/wgcf/releases/download/v2.3.1/wgcf_2.3.1_linux_amd64
          chmod +x /tmp/wgcf
          sudo mv /tmp/wgcf /usr/local/bin/wgcf
          curl -fsSL --max-time 40 -o /tmp/wireproxy.tar.gz https://github.com/pufferffish/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          tar -xzf /tmp/wireproxy.tar.gz -C /tmp
          chmod +x /tmp/wireproxy
          sudo mv /tmp/wireproxy /usr/local/bin/wireproxy
      - name: Independent WARP exit compared with public entry
        run: python -u wula_warp_probe.py
