name: Wula signup verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pyyaml curl_cffi
      - name: Offline routing and existing regression tests
        run: python -m unittest discover -s tests -p 'test_wula*.py' -q
      - name: Existing account subscription and precise captcha-layer diagnosis
        run: python -u wula_signup_verify.py
