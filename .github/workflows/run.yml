name: Wula ARM account refill handoff validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wula-refill-sandbox
  cancel-in-progress: false
jobs:
  private-direct-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/polymerization-1
          token: ${{ secrets.GIT_TOKEN }}
          path: vault_repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pyyaml
      - name: 'Verify raw Wula source export stays separate from speed-filtered aggregate'
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: python wula_export_sandbox_check.py
  arm-refill:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/polymerization-1
          ref: wula-refill-sandbox-20261023
          token: ${{ secrets.GIT_TOKEN }}
          path: vault_repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pyyaml curl_cffi
      - name: 'Prepare account on ARM and update only sandbox bank'
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: python wula_ensure.py --target-branch wula-refill-sandbox-20261023 --force-new
  aggregate-x86:
    needs: arm-refill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/polymerization-1
          ref: wula-refill-sandbox-20261023
          token: ${{ secrets.GIT_TOKEN }}
          path: vault_repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pyyaml curl_cffi
      - name: 'Verify x86 reuses the ARM-created account and downloads nodes'
        env:
          WULA_FORCE_REGISTER: '0'
          WULA_BUDGET_SECONDS: '150'
        run: python plugins/wula.py --outdir /tmp/wula-x86-output
      - name: Assert x86 reused the new account
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('/tmp/wula-x86-output')
          accounts=json.loads((out/'accounts.json').read_text())
          nodes=[x for x in (out/'nodes.txt').read_text().splitlines() if x.strip()]
          assert accounts and accounts[0].get('bank_fallback'), 'x86 did not reuse account bank'
          assert len(nodes)>0, 'x86 subscription output is empty'
          print('HANDOFF_OK cached_account_reused=1 nodes=%d' % len(nodes))
          PY

