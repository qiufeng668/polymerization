name: ATVPN plugin sandbox validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/atvpn-single-20261024
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pyyaml
      - run: python -m unittest tests/test_atvpn_plugin.py -v
