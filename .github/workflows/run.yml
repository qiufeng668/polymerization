name: Auto Multi-Sub Aggregator

on:
  schedule:
    # 每 50 分钟自动运行一次
    - cron: '*/50 * * * *'
  workflow_dispatch: # 允许在 GitHub 网页上手动点击按钮触发

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. 检出公开库代码
        uses: actions/checkout@v4

      - name: 2. 拉取私有库(polymerization-1)的历史状态与缓存
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          AUTHORIZATION_HEADER=$(echo -n "x-access-token:${GIT_TOKEN}" | base64)
          git -c http.extraheader="AUTHORIZATION: basic ${AUTHORIZATION_HEADER}" clone https://github.com/${{ github.repository_owner }}/polymerization-1.git vault_repo || mkdir -p vault_repo

      - name: 3. 配置 Python 环境并安装依赖
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r requirements.txt

      - name: 4. 下载真连接测速内核 (LiteSpeedTest)
        run: |
          wget -q -O lite.gz https://github.com/xxf098/LiteSpeedTest/releases/download/v0.15.0/lite-linux-amd64-v0.15.0.gz
          gunzip -f lite.gz
          chmod +x lite

      - name: 5. 运行主控引擎 (分频运行 PY + 实时无缓冲日志 + 失效监控 + 真测速)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u main_engine.py

      - name: 6. 使用 Git Token 覆盖推送到私有库 (无历史垃圾防膨胀)
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          cd vault_repo
          rm -rf .git
          git init
          git config user.name "AggregatorBot"
          git config user.email "bot@noreply.github.com"
          git branch -M main
          git add .
          NODE_COUNT=$(wc -l < nodes_plain.txt 2>/dev/null | tr -d ' ' || echo "0")
          git commit -m "Auto sync: $(date -u +'%Y-%m-%d %H:%M:%S UTC') (存活: ${NODE_COUNT} 条)" || exit 0
          
          # 使用官方标准 basic header 推送，彻底杜绝 password authentication 拦截
          AUTHORIZATION_HEADER=$(echo -n "x-access-token:${GIT_TOKEN}" | base64)
          git -c http.extraheader="AUTHORIZATION: basic ${AUTHORIZATION_HEADER}" push -f https://github.com/${{ github.repository_owner }}/polymerization-1.git main
