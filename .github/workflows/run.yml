name: Wula expired-cache recovery validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expiry-recovery:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/polymerization-1
          token: ${{ secrets.GIT_TOKEN }}
          path: vault_repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: 'Exercise production path: expired cache -> Chrome registration -> subscription'
        env:
          WULA_FORCE_REGISTER: '1'
          WULA_BUDGET_SECONDS: '300'
          WULA_MAX_ATTEMPTS: '1'
        run: python -u plugins/wula.py --outdir /tmp/wula-expiry-output
      - name: Assert one fresh registration and non-empty subscription
        run: python wula_expiry_sandbox.py --assert-result
