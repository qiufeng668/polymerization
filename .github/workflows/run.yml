name: Auto Multi-Sub Aggregator

on:
  schedule:
    # 每 50 分钟左右执行一次（GitHub Actions 定时任务语法）
    - cron: '*/50 * * * *'
  workflow_dispatch: # 允许你在页面上手动点击按钮触发测试

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35 # 全局超时保护

    steps:
      - name: 1. 检出公开库代码
        uses: actions/checkout@v4

      - name: 2. 拉取私有库(polymerization-1)的历史状态与缓存
        run: |
          git clone https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository_owner }}/polymerization-1.git vault_repo || mkdir -p vault_repo

      - name: 3. 配置 Python 环境并安装依赖
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r requirements.txt

      - name: 4. 下载真连接测速内核 (LiteSpeedTest)
        run: |
          wget -q -O lite.gz https://github.com/xxf098/LiteSpeedTest/releases/download/v0.15.0/lite-linux-amd64-v0.15.0.gz
          gunzip -f lite.gz
          chmod +x lite

      - name: 5. 运行主控引擎 (分频运行 PY + 失效监控 + 真测速 + 导出全格式)
        run: |
          python main_engine.py

      - name: 6. 使用 Git Token 覆盖推送到私有库 (无历史垃圾防膨胀)
        run: |
          cd vault_repo
          rm -rf .git
          git init
          git config user.name "AggregatorBot"
          git config user.email "bot@noreply.github.com"
          git branch -M main
          git add .
          NODE_COUNT=$(wc -l < nodes_plain.txt 2>/dev/null | tr -d ' ' || echo "0")
          git commit -m "Auto sync: $(date -u +'%Y-%m-%d %H:%M:%S UTC') (存活: ${NODE_COUNT} 条)" || exit 0
          git remote add origin https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository_owner }}/polymerization-1.git
          git push -f origin main
