name: Wula read-only transport evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install transports
        run: python -m pip install requests curl_cffi
      - name: TCP, DNS, default TLS and Chrome TLS comparison
        run: python -u wula_net_v2.py
