name: Wula single signup investigation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wula-single-signup-investigation
  cancel-in-progress: false
jobs:
  signup-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/polymerization-1
          token: ${{ secrets.GIT_TOKEN }}
          path: vault_repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pyyaml curl_cffi
      - name: Match official frontend and attempt one ordinary signup
        run: python -u wula_signup_probe.py
      - name: Keep successful single test account in private vault only
        working-directory: vault_repo
        run: |
          if [ -z "$(git status --porcelain -- wula_bank.json)" ]; then
            echo "No new account; private vault unchanged."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add wula_bank.json
          git commit -m "Cache a verified Wula signup account privately"
          git push origin HEAD:main
