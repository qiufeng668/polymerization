name: Wula ARM account refill handoff validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wula-refill-sandbox
  cancel-in-progress: false
jobs:
  private-direct-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/polymerization-1
          token: ${{ secrets.GIT_TOKEN }}
          path: vault_repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pyyaml
      - name: 'Verify raw Wula source export stays separate from speed-filtered aggregate'
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: python wula_export_sandbox_check.py

