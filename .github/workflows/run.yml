name: Auto Multi-Sub Aggregator

on:
  schedule:
    - cron: '*/50 * * * *'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. 检出公开库代码
        uses: actions/checkout@v4

      - name: 2. 🔐 私有库连通性预检 (Fail-Fast 防干等机制)
        run: |
          echo "🔍 正在预检私有库连通性与 Token 权限..."
          # 利用 ls-remote 秒级探测远端仓库。如果 Token 无效，这行会立刻报错并终止任务，绝不拖拉！
          git ls-remote https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository_owner }}/polymerization-1.git > /dev/null
          
          echo "✅ Token 认证成功，连通性测试通过！开始拉取历史缓存..."
          git clone https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository_owner }}/polymerization-1.git vault_repo || mkdir -p vault_repo

      - name: 3. 🐍 配置 Python 环境并安装依赖
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r requirements.txt

      - name: 4. ⚡ 下载真连接测速内核 (LiteSpeedTest)
        run: |
          wget -q -O lite.gz https://github.com/xxf098/LiteSpeedTest/releases/download/v0.15.0/lite-linux-amd64-v0.15.0.gz
          gunzip -f lite.gz
          chmod +x lite

      - name: 5. 🧠 运行主控引擎 (分频运行 PY + 实时无缓冲日志 + 失效监控 + 真测速)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u main_engine.py

      - name: 6. 🚀 覆盖推送到私有库 (无历史垃圾防膨胀)
        run: |
          cd vault_repo
          rm -rf .git
          git init
          git config user.name "AggregatorBot"
          git config user.email "bot@noreply.github.com"
          git branch -M main
          git add .
          NODE_COUNT=$(wc -l < nodes_plain.txt 2>/dev/null | tr -d ' ' || echo "0")
          git commit -m "Auto sync: $(date -u +'%Y-%m-%d %H:%M:%S UTC') (存活: ${NODE_COUNT} 条)" || exit 0
          
          echo "📦 正在向私有库推送最新节点..."
          git remote add origin https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository_owner }}/polymerization-1.git
          git push -f origin main
          echo "🎉 推送完成！"
