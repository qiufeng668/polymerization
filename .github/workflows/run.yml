name: Wula single-account rollover validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rollover:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/polymerization-1
          token: ${{ secrets.GIT_TOKEN }}
          path: vault_repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -p 'test_wula*.py' -q
      - name: Execute production Wula plugin against current expired bank
        env:
          WULA_BUDGET_SECONDS: '300'
          WULA_MAX_ATTEMPTS: '1'
        run: python -u plugins/wula.py --outdir /tmp/wula-rollover-output
      - name: Assert one fresh account, one bank entry, and nodes
        run: python wula_rollover_assert.py
